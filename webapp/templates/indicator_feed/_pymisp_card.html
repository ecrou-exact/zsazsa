{# The query as PyMISP would run it. The id is what _query_js.html rewrites on
   every change to the form, so both pages stay in step with what they show. #}
<div class="card content-card mb-3">
  <div class="card-header d-flex justify-content-between align-items-center">
    <span><i class="fas fa-code me-2"></i>PyMISP query</span>
    <button type="button" class="btn btn-xs btn-outline-secondary" id="copy-query"><i class="fas fa-copy me-1"></i>Copy</button>
  </div>
  <div class="card-body p-0">
    <pre class="mb-0 p-3" id="pymisp-query" style="font-size:.78rem;white-space:pre-wrap;">{{ pymisp_query }}</pre>
  </div>
</div>
